<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物販管理">
<title>物販管理ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #efefed;
  --surface3: #e5e5e3;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #111111;
  --text2: #888888;
  --text3: #bbbbbb;
  --accent: #1a1a1a;
  --accent2: #d4500a;
  --green: #0a7c4e;
  --red: #c0392b;
  --blue: #1a5fa8;
  --purple: #6b3fa0;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; font-size: 15px; }

/* Layout */
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* Nav */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(245,245,243,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border2); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { flex: 1; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border: none; background: none; color: var(--text2); font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; transition: color 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 20px; }

/* Pages */
.page { display: none; flex: 1; overflow-y: auto; padding: 0 0 80px; }
.page.active { display: block; }

/* Header */
.page-header { padding: 52px 20px 16px; position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); }
.page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
.page-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.section { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }

/* Form elements */
.field { display: flex; flex-direction: column; gap: 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
label { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.04em; }
input[type=text], input[type=number], select, textarea {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; font-family: 'Syne', sans-serif; color: var(--text);
  outline: none; transition: border-color 0.2s; width: 100%;
}
input[type=number] { font-family: 'DM Mono', monospace; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--text3); font-size: 13px; }
select option { background: var(--surface2); }
textarea { resize: none; min-height: 60px; }

/* Toggle group */
.toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle-btn { padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Syne', sans-serif; transition: all 0.15s; }
.toggle-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

/* Primary button */
.btn-primary { width: 100%; padding: 14px; border-radius: var(--radius); background: var(--accent); color: #ffffff; border: none; font-size: 14px; font-weight: 800; font-family: 'Syne', sans-serif; cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s, transform 0.12s; }
.btn-primary:active { transform: scale(0.97); opacity: 0.85; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.btn-secondary { width: 100%; padding: 12px; border-radius: var(--radius); background: transparent; color: var(--text2); border: 1px solid var(--border2); font-size: 13px; font-weight: 600; font-family: 'Syne', sans-serif; cursor: pointer; transition: all 0.15s; }
.btn-secondary:active { background: var(--surface2); }

/* Profit display */
.profit-box { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px; }
.profit-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; }
.profit-row .lbl { color: var(--text2); }
.profit-row .val { font-family: 'DM Mono', monospace; font-weight: 500; }
.profit-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
.profit-total { display: flex; justify-content: space-between; align-items: baseline; }
.profit-lbl { font-size: 13px; color: var(--text2); }
.profit-amount { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; }
.p-pos { color: var(--green); }
.p-neg { color: var(--red); }
.p-zero { color: var(--text3); }
.profit-badge-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.b-ok { background: rgba(61,255,170,0.12); color: var(--green); }
.b-ng { background: rgba(255,77,109,0.12); color: var(--red); }
.b-ev { background: var(--surface3); color: var(--text2); }
.rate-txt { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text2); }

/* Photo upload */
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.photo-btn { background: var(--surface2); border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 16px 10px; text-align: center; cursor: pointer; transition: all 0.15s; }
.photo-btn:active { background: var(--surface3); border-color: var(--accent); }
.photo-icon { font-size: 24px; margin-bottom: 4px; }
.photo-label { font-size: 12px; font-weight: 600; color: var(--text2); }
.photo-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
input[type=file] { display: none; }

/* AI result */
.ai-result { background: rgba(26,26,26,0.04); border: 1px solid rgba(26,26,26,0.15); border-radius: var(--radius-sm); padding: 12px; }
.ai-label { font-size: 10px; font-weight: 700; color: var(--text); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.ai-product { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.ai-meta { font-size: 12px; color: var(--text2); }

/* Item list */
.item-list { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; }
.item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; flex: 1; }
.item-status { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.s-stock { background: rgba(77,166,255,0.15); color: var(--blue); }
.s-listed { background: rgba(176,108,255,0.15); color: var(--purple); }
.s-sold { background: rgba(61,255,170,0.15); color: var(--green); }
.s-bought { background: rgba(255,107,53,0.15); color: var(--accent2); }
.item-meta { display: flex; gap: 12px; flex-wrap: wrap; }
.item-meta-item { font-size: 11px; color: var(--text2); }
.item-meta-item span { color: var(--text); font-weight: 600; }
.item-profit { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid var(--border); }
.item-profit-lbl { font-size: 12px; color: var(--text2); }
.item-profit-val { font-size: 16px; font-weight: 700; font-family: 'DM Mono', monospace; }
.item-actions { display: flex; gap: 6px; }
.item-action-btn { flex: 1; padding: 7px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600; font-family: 'Syne', sans-serif; cursor: pointer; text-align: center; }
.item-action-btn:active { background: var(--surface3); }
.item-action-btn.danger { color: var(--red); border-color: rgba(255,77,109,0.2); }

/* Summary cards */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px; }
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.summary-card.full { grid-column: span 2; }
.summary-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.summary-value { font-size: 22px; font-weight: 800; font-family: 'DM Mono', monospace; }
.summary-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* Category bars */
.cat-bar { display: flex; flex-direction: column; gap: 8px; }
.cat-row { display: flex; align-items: center; gap: 10px; }
.cat-name { font-size: 12px; color: var(--text2); width: 80px; flex-shrink: 0; }
.cat-track { flex: 1; height: 4px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.cat-fill { height: 100%; border-radius: 2px; background: var(--text); transition: width 0.5s; }
.cat-val { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text2); width: 50px; text-align: right; }

/* Filter tabs */
.filter-tabs { display: flex; gap: 6px; padding: 12px 20px 0; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-size: 12px; font-weight: 600; font-family: 'Syne', sans-serif; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.filter-tab.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

/* Empty state */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* Spinner */
.spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* API setup */
.setup-banner { margin: 16px 20px; background: rgba(26,26,26,0.04); border: 1px solid rgba(26,26,26,0.15); border-radius: var(--radius); padding: 14px; }
.setup-banner-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.setup-banner-desc { font-size: 12px; color: var(--text2); margin-bottom: 10px; line-height: 1.5; }
.setup-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); outline: none; margin-bottom: 8px; }
.setup-input:focus { border-color: var(--accent); }

/* Settings modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 480px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 800; }
.modal-close { background: none; border: none; color: var(--text2); font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">⚙️ 設定</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>APIキー（写真認識用）</label>
        <input class="setup-input" id="settings-key" type="password" placeholder="sk-ant-api03-..." style="margin-bottom:0;" />
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" style="font-size:13px;" onclick="saveSettings()">保存</button>
        <button class="btn-secondary" style="font-size:13px;color:var(--red);border-color:rgba(255,77,109,0.3);" onclick="deleteKey()">削除</button>
      </div>
    </div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="fc-camera" accept="image/*" capture="environment" onchange="onPhoto(event,'camera')" />
  <input type="file" id="fc-gallery" accept="image/*" onchange="onPhoto(event,'gallery')" />

  <!-- ========== PAGE: 仕入れ ========== -->
  <div class="page active" id="page-shiire">
    <div class="page-header">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="page-title">仕入れ登録</div>
          <div class="page-sub">レシート写真 or 手入力</div>
        </div>
        <button onclick="openModal()" style="background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;">⚙️</button>
      </div>
    </div>

    <div id="api-banner" style="display:none;" class="setup-banner">
      <div class="setup-banner-title">🔑 APIキーを設定</div>
      <div class="setup-banner-desc">写真認識を使うにはAPIキーが必要です。</div>
      <input class="setup-input" id="banner-key" type="password" placeholder="sk-ant-api03-..." />
      <button class="btn-primary" style="font-size:13px;" onclick="saveBannerKey()">保存</button>
    </div>

    <div class="section" style="padding-top:16px;">

      <!-- Photo -->
      <div>
        <div class="section-title" style="margin-bottom:8px;">レシート・商品写真</div>
        <div class="photo-grid">
          <div class="photo-btn" onclick="document.getElementById('fc-camera').click()">
            <div class="photo-icon">📷</div>
            <div class="photo-label">カメラで撮る</div>
            <div class="photo-sub">その場で撮影</div>
          </div>
          <div class="photo-btn" onclick="document.getElementById('fc-gallery').click()">
            <div class="photo-icon">🖼️</div>
            <div class="photo-label">画像を選ぶ</div>
            <div class="photo-sub">保存済みから選択</div>
          </div>
        </div>
        <div id="ai-preview" style="display:none;margin-top:10px;">
          <img id="ai-img" style="width:100%;max-height:160px;object-fit:contain;border-radius:var(--radius-sm);background:#111;display:block;margin-bottom:8px;" />
          <button class="btn-primary" id="ai-btn" onclick="analyzePhoto()" style="font-size:13px;">✨ AIで商品名・価格を読み取る</button>
        </div>
        <div class="ai-result" id="ai-result" style="display:none;margin-top:8px;">
          <div class="ai-label">✨ AI認識結果</div>
          <div class="ai-product" id="ai-product-name"></div>
          <div class="ai-meta" id="ai-product-meta"></div>
        </div>
      </div>

      <!-- 基本情報 -->
      <div class="card">
        <div class="section">
          <div class="section-title">基本情報</div>
          <div class="field">
            <label>商品名</label>
            <input type="text" id="s-name" placeholder="例：ニンジャスピナー BOX" />
          </div>
          <div class="field-row">
            <div class="field">
              <label>カテゴリー</label>
              <select id="s-category">
                <option value="">選択</option>
                <option>PMカード</option>
                <option>OPカード</option>
                <option>DBカード</option>
                <option>プレバン</option>
                <option>雑貨</option>
                <option>家電</option>
                <option>化粧品</option>
                <option>その他</option>
              </select>
            </div>
            <div class="field">
              <label>仕入れ先</label>
              <select id="s-shop">
                <option value="">選択</option>
                <option>ヨドバシ</option>
                <option>ビックカメラ</option>
                <option>Joshin</option>
                <option>ポケセン</option>
                <option>カドショ</option>
                <option>ふるいち</option>
                <option>イオン</option>
                <option>プレバン</option>
                <option>リサイクルショップ</option>
                <option>その他</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>仕入れ価格（円）</label>
              <input type="number" id="s-cost" placeholder="5500" inputmode="numeric" oninput="calcProfit()" />
            </div>
            <div class="field">
              <label>数量</label>
              <input type="number" id="s-qty" placeholder="1" value="1" inputmode="numeric" />
            </div>
          </div>
        </div>
      </div>

      <!-- ポケカ・ワンピ専用 -->
      <div class="card" id="card-condition" style="display:none;">
        <div class="section">
          <div class="section-title">カード状態</div>
          <div class="field">
            <label>シュリンク</label>
            <div class="toggle-group">
              <button class="toggle-btn active" onclick="setToggle(this,'shrink','あり')">あり</button>
              <button class="toggle-btn" onclick="setToggle(this,'shrink','なし')">なし</button>
            </div>
          </div>
          <div class="field">
            <label>テープ</label>
            <div class="toggle-group">
              <button class="toggle-btn active" onclick="setToggle(this,'tape','なし')">なし</button>
              <button class="toggle-btn" onclick="setToggle(this,'tape','あり')">あり</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 販売計画 -->
      <div class="card">
        <div class="section">
          <div class="section-title">販売計画</div>

          <div class="field">
            <label>販売先</label>
            <div class="toggle-group">
              <button class="toggle-btn active" onclick="setChannel(this,'フリマ')">フリマ</button>
              <button class="toggle-btn" onclick="setChannel(this,'買取屋')">買取屋</button>
              <button class="toggle-btn" onclick="setChannel(this,'未定')">未定</button>
            </div>
          </div>

          <!-- フリマ -->
          <div id="section-frima">
            <div class="field-row" style="margin-bottom:10px;">
              <div class="field">
                <label>出品先</label>
                <select id="s-platform">
                  <option>メルカリ</option>
                  <option>ヤフオク</option>
                  <option>楽天</option>
                  <option>Amazon</option>
                  <option>ラクマ</option>
                </select>
              </div>
              <div class="field">
                <label>出品価格（円）</label>
                <input type="number" id="s-sell" placeholder="8000" inputmode="numeric" oninput="calcProfit()" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>送料（円）</label>
                <input type="number" id="s-ship" placeholder="210" inputmode="numeric" oninput="calcProfit()" />
              </div>
              <div class="field">
                <label>手数料率（%）</label>
                <input type="number" id="s-fee" placeholder="10" value="10" inputmode="numeric" oninput="calcProfit()" />
              </div>
            </div>
          </div>

          <!-- 買取屋 -->
          <div id="section-kaitori" style="display:none;">
            <div class="field">
              <label>買取価格（円）</label>
              <input type="number" id="s-kaitori" placeholder="7000" inputmode="numeric" oninput="calcProfit()" />
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:4px;">※ 買取価格は変動するため都度入力してください</div>
          </div>

          <!-- 利益計算 -->
          <div class="profit-box">
            <div class="profit-row"><span class="lbl">手数料</span><span class="val" id="r-fee">—</span></div>
            <div class="profit-row"><span class="lbl">合計コスト</span><span class="val" id="r-cost">—</span></div>
            <hr class="profit-divider" />
            <div class="profit-total">
              <span class="profit-lbl">利益</span>
              <span class="profit-amount p-zero" id="r-profit">—</span>
            </div>
            <div class="profit-badge-row">
              <span class="badge b-ev" id="r-badge">入力待ち</span>
              <span class="rate-txt" id="r-rate"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- メモ -->
      <div class="field">
        <label>メモ</label>
        <textarea id="s-memo" placeholder="買取価格の変動、状態など自由記入"></textarea>
      </div>

      <button class="btn-primary" onclick="saveItem()">📦 登録する</button>
    </div>
  </div>

  <!-- ========== PAGE: 在庫 ========== -->
  <div class="page" id="page-zaiko">
    <div class="page-header">
      <div class="page-title">在庫・販売管理</div>
      <div class="page-sub">登録済み商品の一覧</div>
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" onclick="filterItems(this,'全て')">全て</button>
      <button class="filter-tab" onclick="filterItems(this,'在庫')">在庫</button>
      <button class="filter-tab" onclick="filterItems(this,'出品中')">出品中</button>
      <button class="filter-tab" onclick="filterItems(this,'販売済')">販売済</button>
      <button class="filter-tab" onclick="filterItems(this,'買取屋')">買取屋</button>
    </div>
    <div id="item-list" class="item-list"></div>
  </div>

  <!-- ========== PAGE: 月次 ========== -->
  <div class="page" id="page-monthly">
    <div class="page-header">
      <div class="page-title">集計</div>
      <div class="page-sub">月次・年間トータル</div>
    </div>

    <!-- 表示切替 -->
    <div class="filter-tabs" id="period-tabs" style="padding-bottom:12px;">
      <button class="filter-tab active" onclick="setPeriodMode(this,'month')">月次</button>
      <button class="filter-tab" onclick="setPeriodMode(this,'year')">年間</button>
    </div>

    <!-- 月次モード -->
    <div id="mode-month">
      <!-- 月選択 -->
      <div style="display:flex;align-items:center;gap:12px;padding:0 20px 14px;">
        <button onclick="changeMonth(-1)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 14px;color:var(--text);font-size:18px;cursor:pointer;font-family:'Syne',sans-serif;">‹</button>
        <div style="flex:1;text-align:center;font-size:16px;font-weight:800;" id="monthly-period">—</div>
        <button onclick="changeMonth(1)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 14px;color:var(--text);font-size:18px;cursor:pointer;font-family:'Syne',sans-serif;">›</button>
      </div>
      <div class="summary-grid" id="summary-grid"></div>
      <div class="section" style="padding-top:0;">
        <div class="card">
          <div class="section">
            <div class="section-title">カテゴリー別利益</div>
            <div class="cat-bar" id="cat-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 年間モード -->
    <div id="mode-year" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;padding:0 20px 14px;">
        <button onclick="changeYear(-1)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 14px;color:var(--text);font-size:18px;cursor:pointer;font-family:'Syne',sans-serif;">‹</button>
        <div style="flex:1;text-align:center;font-size:16px;font-weight:800;" id="yearly-period">—</div>
        <button onclick="changeYear(1)" style="background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 14px;color:var(--text);font-size:18px;cursor:pointer;font-family:'Syne',sans-serif;">›</button>
      </div>
      <div class="summary-grid" id="year-summary-grid"></div>
      <div class="section" style="padding-top:0;">
        <div class="card">
          <div class="section">
            <div class="section-title">月別利益推移</div>
            <div class="cat-bar" id="month-bar"></div>
          </div>
        </div>
        <div class="card">
          <div class="section">
            <div class="section-title">カテゴリー別利益（年間）</div>
            <div class="cat-bar" id="year-cat-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('shiire',this)">
      <span class="nav-icon">📦</span>仕入れ
    </button>
    <button class="nav-btn" onclick="showPage('zaiko',this)">
      <span class="nav-icon">📋</span>在庫
    </button>
    <button class="nav-btn" onclick="showPage('monthly',this)">
      <span class="nav-icon">📊</span>月次
    </button>
  </nav>
</div>

<script>
const API_KEY_STORAGE = 'buhin_api_key';
const ITEMS_STORAGE = 'buhin_items';

let currentChannel = 'フリマ';
let currentShrink = 'あり';
let currentTape = 'なし';
let currentImageBase64 = null;
let currentFilter = '全て';

// Init
window.onload = () => {
  if (!localStorage.getItem(API_KEY_STORAGE)) {
    document.getElementById('api-banner').style.display = 'block';
  }
  // Show card condition fields for card categories
  document.getElementById('s-category').addEventListener('change', function() {
    const cardCats = ['PMカード','OPカード','DBカード'];
    document.getElementById('card-condition').style.display = cardCats.includes(this.value) ? 'block' : 'none';
  });
  renderItems();
  renderSummary();
  updateMonthlyPeriod();
};

// Navigation
function showPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
  if (page === 'zaiko') renderItems();
  if (page === 'monthly') { if(periodMode==='month') renderSummary(); else renderYearSummary(); }
}

// Modal
function openModal() {
  document.getElementById('settings-modal').classList.add('open');
  const k = localStorage.getItem(API_KEY_STORAGE);
  if (k) document.getElementById('settings-key').placeholder = k.slice(0,20) + '...';
}
function closeModal() { document.getElementById('settings-modal').classList.remove('open'); }
function saveSettings() {
  const k = document.getElementById('settings-key').value.trim();
  if (!k) { closeModal(); return; }
  if (!k.startsWith('sk-ant-')) { alert('正しいAPIキーを入力してください'); return; }
  localStorage.setItem(API_KEY_STORAGE, k);
  document.getElementById('api-banner').style.display = 'none';
  closeModal();
  alert('保存しました！');
}
function deleteKey() {
  if (!confirm('APIキーを削除しますか？')) return;
  localStorage.removeItem(API_KEY_STORAGE);
  document.getElementById('api-banner').style.display = 'block';
  closeModal();
}
function saveBannerKey() {
  const k = document.getElementById('banner-key').value.trim();
  if (!k.startsWith('sk-ant-')) { alert('正しいAPIキーを入力してください'); return; }
  localStorage.setItem(API_KEY_STORAGE, k);
  document.getElementById('api-banner').style.display = 'none';
}

// Toggle helpers
function setToggle(btn, type, val) {
  const group = btn.closest('.toggle-group');
  group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (type === 'shrink') currentShrink = val;
  if (type === 'tape') currentTape = val;
}
function setChannel(btn, channel) {
  const group = btn.closest('.toggle-group');
  group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentChannel = channel;
  document.getElementById('section-frima').style.display = channel === 'フリマ' ? 'block' : 'none';
  document.getElementById('section-kaitori').style.display = channel === '買取屋' ? 'block' : 'none';
  calcProfit();
}

// Photo
function onPhoto(e, source) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImageBase64 = ev.target.result.split(',')[1];
    document.getElementById('ai-img').src = ev.target.result;
    document.getElementById('ai-preview').style.display = 'block';
    document.getElementById('ai-result').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function analyzePhoto() {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) { document.getElementById('api-banner').style.display = 'block'; return; }
  if (!currentImageBase64) return;

  const btn = document.getElementById('ai-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 解析中...';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: currentImageBase64 } },
            { type: 'text', text: `このレシートまたは商品画像から情報を読み取ってください。JSONのみで返してください。
{
  "name": "商品名（できるだけ具体的に）",
  "price": 数値のみ（円、読み取れない場合はnull）,
  "shop": "店舗名（読み取れない場合はnull）",
  "category": "PMカード/OPカード/DBカード/雑貨/家電/化粧品/その他 のいずれか",
  "note": "補足情報（1文）"
}` }
          ]
        }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content[0].text;
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    document.getElementById('s-name').value = parsed.name || '';
    if (parsed.price) document.getElementById('s-cost').value = parsed.price;
    if (parsed.shop) {
      const sel = document.getElementById('s-shop');
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].text.includes(parsed.shop)) { sel.selectedIndex = i; break; }
      }
    }
    if (parsed.category) {
      const sel = document.getElementById('s-category');
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].text === parsed.category) {
          sel.selectedIndex = i;
          sel.dispatchEvent(new Event('change'));
          break;
        }
      }
    }

    document.getElementById('ai-product-name').textContent = parsed.name || '商品名不明';
    document.getElementById('ai-product-meta').textContent =
      [parsed.price ? `¥${parsed.price.toLocaleString()}` : null, parsed.shop, parsed.note].filter(Boolean).join(' · ');
    document.getElementById('ai-result').style.display = 'block';
    calcProfit();
  } catch (err) {
    alert('認識エラー：' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ AIで商品名・価格を読み取る';
  }
}

// Profit calc
function calcProfit() {
  const cost = parseFloat(document.getElementById('s-cost').value) || 0;
  const sell = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-sell').value) || 0) : (parseFloat(document.getElementById('s-kaitori').value) || 0);
  const ship = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-ship').value) || 0) : 0;
  const feeRate = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-fee').value) || 0) : 0;
  if (!sell && !cost) return;
  const feeAmt = Math.round(sell * feeRate / 100);
  const totalCost = cost + ship + feeAmt;
  const profit = sell - totalCost;
  const rate = sell > 0 ? Math.round(profit / sell * 100) : 0;
  document.getElementById('r-fee').textContent = feeAmt > 0 ? '¥' + feeAmt.toLocaleString() : '—';
  document.getElementById('r-cost').textContent = '¥' + totalCost.toLocaleString();
  const pe = document.getElementById('r-profit');
  pe.textContent = (profit >= 0 ? '+' : '') + '¥' + profit.toLocaleString();
  pe.className = 'profit-amount ' + (profit > 0 ? 'p-pos' : profit < 0 ? 'p-neg' : 'p-zero');
  const badge = document.getElementById('r-badge');
  badge.className = 'badge ' + (profit > 0 ? 'b-ok' : profit < 0 ? 'b-ng' : 'b-ev');
  badge.textContent = profit > 0 ? '利益あり' : profit < 0 ? '赤字' : 'トントン';
  document.getElementById('r-rate').textContent = sell > 0 ? '利益率 ' + rate + '%' : '';
}

// Save item
function saveItem() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) { alert('商品名を入力してください'); return; }
  const cost = parseFloat(document.getElementById('s-cost').value) || 0;
  const sell = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-sell').value) || 0) : (parseFloat(document.getElementById('s-kaitori').value) || 0);
  const ship = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-ship').value) || 0) : 0;
  const feeRate = currentChannel === 'フリマ' ? (parseFloat(document.getElementById('s-fee').value) || 0) : 0;
  const feeAmt = Math.round(sell * feeRate / 100);
  const profit = sell - cost - ship - feeAmt;
  const rate = sell > 0 ? Math.round(profit / sell * 100) : 0;

  const item = {
    id: Date.now(),
    date: new Date().toISOString().slice(0,10),
    name,
    category: document.getElementById('s-category').value,
    shop: document.getElementById('s-shop').value,
    cost,
    qty: parseInt(document.getElementById('s-qty').value) || 1,
    channel: currentChannel,
    platform: currentChannel === 'フリマ' ? document.getElementById('s-platform').value : '買取屋',
    sell,
    ship,
    feeRate,
    feeAmt,
    profit,
    rate,
    shrink: currentShrink,
    tape: currentTape,
    memo: document.getElementById('s-memo').value,
    status: currentChannel === '未定' ? '在庫' : currentChannel === '買取屋' ? '買取屋' : '出品中'
  };

  const items = getItems();
  items.unshift(item);
  localStorage.setItem(ITEMS_STORAGE, JSON.stringify(items));

  // Reset
  ['s-name','s-cost','s-sell','s-ship','s-memo','s-kaitori'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('s-qty').value = '1';
  document.getElementById('s-fee').value = '10';
  document.getElementById('ai-preview').style.display = 'none';
  document.getElementById('ai-result').style.display = 'none';
  currentImageBase64 = null;
  ['r-fee','r-cost','r-profit','r-rate'].forEach(id => { document.getElementById(id).textContent = '—'; });
  document.getElementById('r-badge').textContent = '入力待ち';
  document.getElementById('r-badge').className = 'badge b-ev';

  alert('✅ 登録しました！');
}

// Get items
function getItems() {
  try { return JSON.parse(localStorage.getItem(ITEMS_STORAGE)) || []; } catch { return []; }
}

// Filter
function filterItems(btn, filter) {
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = filter;
  renderItems();
}

// Render items
function renderItems() {
  const items = getItems();
  const filtered = currentFilter === '全て' ? items : items.filter(i => i.status === currentFilter);
  const list = document.getElementById('item-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">登録された商品はありません</div></div>';
    return;
  }
  list.innerHTML = filtered.map(item => `
    <div class="item-card" id="item-${item.id}">
      <div class="item-header">
        <div class="item-name">${item.name}</div>
        <span class="item-status ${statusClass(item.status)}">${item.status}</span>
      </div>
      <div class="item-meta">
        <div class="item-meta-item">仕入れ <span>¥${item.cost.toLocaleString()}</span></div>
        ${item.sell ? `<div class="item-meta-item">販売 <span>¥${item.sell.toLocaleString()}</span></div>` : ''}
        <div class="item-meta-item">販売先 <span>${item.platform || '—'}</span></div>
        ${item.category ? `<div class="item-meta-item"><span>${item.category}</span></div>` : ''}
        ${item.shop ? `<div class="item-meta-item">仕入れ先 <span>${item.shop}</span></div>` : ''}
        ${(item.category === 'PMカード' || item.category === 'OPカード' || item.category === 'DBカード') ? `<div class="item-meta-item">シュリ <span>${item.shrink}</span> テープ <span>${item.tape}</span></div>` : ''}
      </div>
      ${item.sell ? `
      <div class="item-profit">
        <span class="item-profit-lbl">利益 (${item.rate}%)</span>
        <span class="item-profit-val ${item.profit >= 0 ? 'p-pos' : 'p-neg'}">${item.profit >= 0 ? '+' : ''}¥${item.profit.toLocaleString()}</span>
      </div>` : ''}
      <div class="item-actions">
        ${item.status !== '販売済' && item.status !== '買取屋' ? `<button class="item-action-btn" onclick="markSold(${item.id})">✅ 販売済に</button>` : ''}
        <button class="item-action-btn danger" onclick="deleteItem(${item.id})">🗑 削除</button>
      </div>
      ${item.memo ? `<div style="font-size:11px;color:var(--text3);padding-top:4px;">${item.memo}</div>` : ''}
    </div>
  `).join('');
}

function statusClass(s) {
  if (s === '在庫') return 's-stock';
  if (s === '出品中') return 's-listed';
  if (s === '販売済') return 's-sold';
  if (s === '買取屋') return 's-bought';
  return '';
}

function markSold(id) {
  const items = getItems();
  const i = items.findIndex(x => x.id === id);
  if (i >= 0) { items[i].status = '販売済'; localStorage.setItem(ITEMS_STORAGE, JSON.stringify(items)); renderItems(); }
}

function deleteItem(id) {
  if (!confirm('削除しますか？')) return;
  const items = getItems().filter(x => x.id !== id);
  localStorage.setItem(ITEMS_STORAGE, JSON.stringify(items));
  renderItems();
}

// Period state
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let currentYearView = new Date().getFullYear();
let periodMode = 'month';

function setPeriodMode(btn, mode) {
  document.querySelectorAll('#period-tabs .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  periodMode = mode;
  document.getElementById('mode-month').style.display = mode === 'month' ? 'block' : 'none';
  document.getElementById('mode-year').style.display = mode === 'year' ? 'block' : 'none';
  if (mode === 'month') renderSummary();
  else renderYearSummary();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderSummary();
}

function changeYear(delta) {
  currentYearView += delta;
  renderYearSummary();
}

function calcStats(items) {
  const allItems = items;
  const totalCost = allItems.reduce((s,i) => s + (i.cost * (i.qty||1)), 0);
  const soldItems = allItems.filter(i => i.status === '販売済' || i.status === '買取屋');
  const totalSell = soldItems.reduce((s,i) => s + (i.sell||0), 0);
  const totalProfit = soldItems.reduce((s,i) => s + (i.profit||0), 0);
  const totalShip = soldItems.reduce((s,i) => s + (i.ship||0), 0);
  const totalFee = soldItems.reduce((s,i) => s + (i.feeAmt||0), 0);
  const profitRate = totalSell > 0 ? Math.round(totalProfit / totalSell * 100) : 0;
  const stockItems = allItems.filter(i => i.status === '在庫' || i.status === '出品中');
  return { totalCost, soldItems, totalSell, totalProfit, totalShip, totalFee, profitRate, stockItems };
}

function renderSummaryGrid(gridId, stats, label) {
  const { totalCost, soldItems, totalSell, totalProfit, totalShip, totalFee, profitRate, stockItems } = stats;
  document.getElementById(gridId).innerHTML = `
    <div class="summary-card full">
      <div class="summary-label">${label}利益</div>
      <div class="summary-value ${totalProfit >= 0 ? 'p-pos' : 'p-neg'}">${totalProfit >= 0 ? '+' : ''}¥${totalProfit.toLocaleString()}</div>
      <div class="summary-sub">利益率 ${profitRate}%</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">総売上</div>
      <div class="summary-value">¥${totalSell.toLocaleString()}</div>
      <div class="summary-sub">${soldItems.length}件販売</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">総仕入れ</div>
      <div class="summary-value">¥${totalCost.toLocaleString()}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">送料合計</div>
      <div class="summary-value">¥${totalShip.toLocaleString()}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">手数料合計</div>
      <div class="summary-value">¥${totalFee.toLocaleString()}</div>
    </div>
    <div class="summary-card full">
      <div class="summary-label">在庫資産</div>
      <div class="summary-value">¥${stockItems.reduce((s,i) => s + i.cost * (i.qty||1), 0).toLocaleString()}</div>
      <div class="summary-sub">${stockItems.length}件在庫中</div>
    </div>
  `;
}

function renderCatBar(barId, soldItems) {
  const cats = {};
  soldItems.forEach(i => {
    const c = i.category || 'その他';
    if (!cats[c]) cats[c] = 0;
    cats[c] += i.profit || 0;
  });
  const maxP = Math.max(...Object.values(cats), 1);
  const bar = document.getElementById(barId);
  if (Object.keys(cats).length === 0) {
    bar.innerHTML = '<div style="font-size:12px;color:var(--text3);">販売済みデータなし</div>';
  } else {
    bar.innerHTML = Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([cat, profit]) => `
      <div class="cat-row">
        <span class="cat-name">${cat}</span>
        <div class="cat-track"><div class="cat-fill" style="width:${Math.max(0,profit/maxP*100)}%"></div></div>
        <span class="cat-val ${profit>=0?'p-pos':'p-neg'}">${profit>=0?'+':''}¥${Math.abs(profit).toLocaleString()}</span>
      </div>`).join('');
  }
}

function renderSummary() {
  const ym = currentYear + '-' + String(currentMonth).padStart(2,'0');
  document.getElementById('monthly-period').textContent = currentYear + '年' + currentMonth + '月';
  const items = getItems().filter(i => i.date && i.date.startsWith(ym));
  const stats = calcStats(items);
  renderSummaryGrid('summary-grid', stats, '当月');
  renderCatBar('cat-bar', stats.soldItems);
}

function renderYearSummary() {
  document.getElementById('yearly-period').textContent = currentYearView + '年';
  const allItems = getItems().filter(i => i.date && i.date.startsWith(String(currentYearView)));
  const stats = calcStats(allItems);
  renderSummaryGrid('year-summary-grid', stats, '年間');
  renderCatBar('year-cat-bar', stats.soldItems);

  // Monthly bar for year
  const months = Array.from({length:12},(_,i)=>i+1);
  const monthProfits = months.map(m => {
    const ym = currentYearView + '-' + String(m).padStart(2,'0');
    const items = getItems().filter(i => i.date && i.date.startsWith(ym) && (i.status==='販売済'||i.status==='買取屋'));
    return { m, profit: items.reduce((s,i)=>s+(i.profit||0),0) };
  });
  const maxP = Math.max(...monthProfits.map(x=>Math.abs(x.profit)), 1);
  document.getElementById('month-bar').innerHTML = monthProfits.filter(x=>x.profit!==0).map(({m,profit}) => `
    <div class="cat-row">
      <span class="cat-name">${m}月</span>
      <div class="cat-track"><div class="cat-fill" style="width:${Math.abs(profit)/maxP*100}%;background:${profit>=0?'var(--accent)':'var(--red)'}"></div></div>
      <span class="cat-val ${profit>=0?'p-pos':'p-neg'}">${profit>=0?'+':''}¥${Math.abs(profit).toLocaleString()}</span>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text3);">データなし</div>';
}

function updateMonthlyPeriod() { renderSummary(); }
</script>
</body>
</html>
